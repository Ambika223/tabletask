<div class="container">
    <div class="row">
        <div class="col">

            <h2 class="text-center bg-info p-3">{{productsText}}</h2>
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let product of products">{{product}}</li>
            </ul>
        </div>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-5">
            <h3 class="text-center bg-dark text-white">{{fruitsText}}</h3>
            <ul class="list-group">
                <li class="list-group-item text-center" *ngFor="let fruit of fruits">{{fruit}}</li>
            </ul>
        </div>
    </div>
</div>


<div class="container mt-5">
    <div class="row">
        <div class="col-md-4">
            <h3 class="text-center bg-primary text-white">{{colorsText}}</h3>
            <ul class="list-group">
                <li class="list-group-item text-center" *ngFor="let color of colors">{{color}}</li>
            </ul>
        </div>
    </div>
</div>
