<div class="container">
    <div class="row">
        <div class="col-md-4">
            <div class="form-group">
                <label for="">Enter Product Name</label>
                <input #productName type="text" class="form-control text-center mt-4">

            </div>

        </div>
    </div>
</div>
<button type="button" (click)="onProdAdd()" class="btn btn-primary">Add Product</button>

<hr>
<p *ngIf="searchProdName; else noProduct" class="alert alert-primary">The Product is {{searchProdName}}</p>

<ng-template #noProduct>
    <p class="alert alert-warning">No product added yet!!!</p>
</ng-template>
